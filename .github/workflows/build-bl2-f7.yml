
    
  
name: Build BL2-F7 Android

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Choose the APK type"
        required: true
        default: instrumented
        type: choice
        options:
          - instrumented
          - release

permissions:
  contents: read

concurrency:
  group: bl2-f7-${{ github.ref }}
  cancel-in-progress: true

env:
  EDEN_SHA: 58c1e20ee58efa3900ba616207d460886214480b
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_CMAKE_VERSION: 3.22.1

jobs:
  build:
    name: Build BL2-F7 (${{ inputs.build_variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout BL2-F7 repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Show toolchain versions
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          cmake --version || true
          python3 --version
          git --version
          sdkmanager --list_installed | grep -E "android-36|build-tools|ndk|cmake" || true

      - name: Prepare Eden v0.2.1 and apply BL2-F7 patch
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./scripts/prepare-eden.sh
          ./scripts/prepare-eden.sh

      - name: Verify exact Eden base
        shell: bash
        run: |
          set -euxo pipefail
          ACTUAL_SHA="$(git -C eden rev-parse HEAD)"
          echo "Expected: ${EDEN_SHA}"
          echo "Actual:   ${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EDEN_SHA}"

      - name: Static BL2-F7 verification
        shell: bash
        run: |
          set -euxo pipefail
          cd eden
          python3 ../patch-kit/scripts/verify_bl2_f7.py

      - name: Build BL2-F7 APK

